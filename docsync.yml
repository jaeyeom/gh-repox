        why: "cmd/gh-repox/ main entry point"
      - path: docs/PROMPT.md
        section: "## Extension identity"
        why: "binary name gh-repox"
      - path: docs/PROMPT.md
        section: "## Internal architecture"
        why: "Go + Cobra package layout"
      - path: docs/PROMPT.md
