# Code paths → the docs that shadow them.
# Built from both directions:
#   1. each README / docs/PROMPT.md / CLAUDE.md section → implementing sources
#   2. every source file → the sections it would stale
# Matching is root-anchored. No implicit **/.
#
# Left unmatched on purpose:
#   go.sum — module checksum lockfile
#   retry.go — only the github package-layout rules; no doc describes
#     post-create 404 retry
#   docs/PROMPT.md product-goals / design-principles / milestones /
#     acceptance-criteria / stricter-org-policy (unimplemented)
#   duplicate ### Usage / ### Behavior / ### Example invocations headings
#     (not unique; parent command sections are mapped instead)
#   PR template Summary/Demo/Flakiness/Reviewer notes (process, not code)

version: 1
